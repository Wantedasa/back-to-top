<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Back to Top — free by wantedasa.dev</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background:#0d1117; color:#e6edf3; padding:24px; text-align:center; }
  .tag { font-size:.8rem; color:#8b949e; }
  .note { font-size:.8rem; color:#6b7280; max-width:520px; }
  
</style>
</head>
<body>
<div style="height:220px;overflow:auto;width:100%;max-width:420px;text-align:left;color:#8b949e;border:1px solid #30363d;border-radius:10px;padding:14px">Scroll down…<br><br>(imagine a long page)<br><br>keep going<br><br>almost<br><br>there<br><br>bottom.</div><button id="bt" style="display:none;position:fixed;bottom:20px;right:20px;width:46px;height:46px;border-radius:50%;border:1px solid #2f81f7;background:#2f81f7;color:#fff;font-size:1.2rem;cursor:pointer">↑</button>
<p class="note">Demo scoped to a scroll box so it works inside the iframe.</p>
<script>
var box=document.querySelector('div'),btn=document.getElementById('bt');box.addEventListener('scroll',function(){btn.style.display=box.scrollTop>80?'block':'none';});btn.onclick=function(){box.scrollTo({top:0,behavior:'smooth'});};
</script>
</body>
</html>
